{
"name": "Build APK",
"on": {"workflow_dispatch": {}, "push": {"branches": ["main"]}},
"jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"uses": "actions/setup-node@v4", "with": {"node-version": 20}},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": 17}},
{"run": "npm install"},
{"run": "npx expo prebuild --platform android --no-install"},
{"run": "cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "zec-hamyon-apk", "path": "android/app/build/outputs/apk/release/*.apk"}}
]}}
}
